name: Build and publish SEneCa image

"on":
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  docker:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v') &&
       !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/supsi-dacd-isaac/seneca
    steps:
      - name: Check out the exact released code without Git LFS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          lfs: false

      - name: Validate code version and data pin
        id: versions
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Release code tag must be vX.Y.Z" >&2
              exit 1
            }
            git merge-base --is-ancestor HEAD origin/main || {
              echo "Release commit must be on main" >&2
              exit 1
            }
            echo "code_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "code_version=dry-run" >> "$GITHUB_OUTPUT"
          fi
          echo "data_tag=$(python3 -c 'import json; print(json.load(open("data-release.json"))["tag"])')" >> "$GITHUB_OUTPUT"

      - name: Test data-release tooling
        run: python3 -m unittest discover -s tests -v

      - name: Fetch and verify pinned data release
        run: |
          python3 scripts/data_release.py fetch
          python3 scripts/data_release.py verify

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and smoke-test AMD64 before publishing
        shell: bash
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg "CODE_VERSION=${{ steps.versions.outputs.code_version }}" \
            --build-arg "DATA_RELEASE_TAG=${{ steps.versions.outputs.data_tag }}" \
            -t seneca:smoke .
          docker run --rm --entrypoint python seneca:smoke scripts/data_release.py verify
          docker run --rm --entrypoint python seneca:smoke -c \
            'from pathlib import Path; import pyarrow.parquet as pq; files=list(Path("precomputed").rglob("*.parquet")); assert len(files)==9; assert all(pq.ParquetFile(f).metadata.num_rows > 0 for f in files)'
          docker run -d --name seneca-smoke -p 127.0.0.1:18501:8501 seneca:smoke
          trap 'docker rm -f seneca-smoke >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 2 http://127.0.0.1:18501/_stcore/health

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          if docker manifest inspect "${IMAGE}:${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Image tag already exists: ${IMAGE}:${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Build both architectures and publish stable release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.versions.outputs.code_version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            CODE_VERSION=${{ steps.versions.outputs.code_version }}
            DATA_RELEASE_TAG=${{ steps.versions.outputs.data_tag }}
