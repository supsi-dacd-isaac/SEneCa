name: PR checks

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SURE_VARIANT: v7
      PYTHONHASHSEED: 0
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.8'
          cache: pip
          cache-dependency-path: sure_julia/python.lock
      - name: Install pinned Python dependencies
        run: python -m pip install -r sure_julia/python.lock
      - name: Fetch and verify data used by the interface
        run: |
          python scripts/data_release.py fetch
          python scripts/data_release.py verify
      - name: Unit and interface tests
        run: |
          python -m unittest discover -s tests -v
