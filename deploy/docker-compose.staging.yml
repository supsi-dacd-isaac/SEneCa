# Staging su Elettra, accanto alla produzione (seneca-streamlit-prod, porta 8501).
# Progetto, container, immagine e porta propri: avvio e arresto non toccano la produzione.
#
#   docker compose -f deploy/docker-compose.staging.yml up -d --build   # avvia
#   docker compose -f deploy/docker-compose.staging.yml logs -f         # log
#   docker compose -f deploy/docker-compose.staging.yml down            # ferma e rimuove
name: seneca-staging
services:
  streamlit-app:
    build:
      context: ..
      dockerfile: Dockerfile   # la stessa immagine della produzione
      args:
        HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
        NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        no_proxy: ${no_proxy:-${NO_PROXY:-}}
    image: seneca-staging:native
    ports:
      - "${SENECA_STAGING_PORT:-8503}:8501"
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-}}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    # facoltativo: la stessa .env della produzione (chiave CARTO per le mappe)
    env_file:
      - path: ../.env
        required: false
    mem_limit: 8g
    restart: unless-stopped
    container_name: seneca-staging
